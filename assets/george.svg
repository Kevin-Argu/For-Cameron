<svg xmlns="http://www.w3.org/2000/svg" width="360" height="188" viewBox="0 0 360 188">
  <title>George, a little lop-eared rabbit made of ASCII characters</title>
  <!-- Hand-composed rows form two drooping ears, a round back, and tucked feet. -->
  <!-- Set white-space on each text element: browsers otherwise collapse the spaces that align the drawing. -->
  <g fill="#c9bca9" font-family="'Courier New', monospace" font-size="16" xml:space="preserve">
    <text style="white-space: pre" x="8" y="18">                         _     _</text>
    <text style="white-space: pre" x="8" y="34">                        / \.-./ \</text>
    <text style="white-space: pre" x="8" y="50">           _..---.._   / / o o \ \</text>
    <text style="white-space: pre" x="8" y="66">        .-'         '-/ |  Y  |  |</text>
    <text style="white-space: pre" x="8" y="82">      .'    .   .      \ \ =w= / /</text>
    <text style="white-space: pre" x="8" y="98">     /     .      .     \_) (_/</text>
    <text style="white-space: pre" x="8" y="114">    ;    .     .        /</text>
    <text style="white-space: pre" x="8" y="130">    |       .          /</text>
    <text style="white-space: pre" x="8" y="146"> .-.\       __        .'</text>
    <text style="white-space: pre" x="8" y="162">(   ) '._.-'  '-.   _.'</text>
    <text style="white-space: pre" x="8" y="178"> '---'---\______/--'(___)</text>
  </g>
</svg>
