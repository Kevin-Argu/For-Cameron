<html lang="en">

  <nav class="back-nav" aria-label="Page navigation"><a href="index.html">← the garden</a></nav>
  <main class="little-field">

      <div class="sculpture-stage">
        <canvas id="splitRockerCanvas" width="876" height="936" role="img" aria-label="Split-Rocker in full bloom, drawn from glowing characters: colorful blossoms and green leaves against the night. A little green hummingbird flutters around the flowers."></canvas>

      <figcaption><span aria-hidden="true">* ·</span> split-rocker <span aria-hidden="true">· *</span></figcaption>
    </figure>
