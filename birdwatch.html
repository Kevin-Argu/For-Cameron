<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A little birdwatching — Cameron</title><link rel="stylesheet" href="css/birdwatch.css"></head>
<body><main>
<section class="forest" aria-labelledby="heading">
<h1 id="heading">In the simplest moments.</h1>
<p class="hint">A little birdwatching, just for you.</p>
<button class="binoculars" id="binoculars" type="button" aria-controls="sighting" aria-expanded="false"><span aria-hidden="true">◉ ◉</span><small>Look through the binoculars</small></button>
<div class="view" id="sighting" aria-live="polite">
<div class="branch"></div><div class="robin" role="img" aria-label="Illustrated American robin with a warm orange-red breast"><span class="tail"></span><span class="body"></span><span class="wing"></span><span class="head"></span><span class="beak"></span><span class="eye"></span></div>
<div class="scope" aria-hidden="true"></div>
<p class="sighting-label" id="robinLabel">A robin! ♡</p></div>
<p class="scroll-hint">Keep scrolling to see who else is here ↓</p>
</section>
<section class="meadow" aria-label="Hummingbird in the flowers"><h2>And a little visitor...</h2><div class="flowers" aria-hidden="true">✿　❀　✿　❀　✿</div><div class="hummingbird" role="img" aria-label="Illustrated hummingbird hovering above flowers"><span class="bird-body"></span><span class="bird-wing"></span><span class="bird-head"></span><span class="bird-beak"></span></div><p>Sometimes all it takes is looking a little closer.</p></section>
</main><script src="js/birdwatch.js" defer></script></body></html>
