<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cameron</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Critical styling keeps the welcome screen usable even with a cached old stylesheet. -->
    <style>
      html:has(body.peanut-lock) { overflow: hidden !important; }
      body.peanut-lock { position: fixed !important; inset: 0 !important; width: 100% !important; height: 100% !important; overflow: hidden !important; }
      #peanutGate { position: fixed !important; inset: 0 !important; z-index: 2147483647 !important; background: #000 !important; color: #f2f2f2 !important; display: flex !important; align-items: center !important; justify-content: center !important; padding: 24px !important; box-sizing: border-box !important; opacity: 1; transition: opacity .45s ease; font-family: Arial, Helvetica, sans-serif !important; text-align: center !important; }
      #peanutGate .peanut-gate-card { width: 100%; max-width: 1100px; margin: auto; text-align: center; }
      #peanutGate .peanut-gate-icon { display: block; width: 44px; height: 44px; margin: 0 auto 30px; color: #d1d1d1; }
      #peanutGate h1 { margin: 0 0 28px; color: #f2f2f2; font: 700 clamp(25px, 3.5vw, 36px)/1.2 Arial, sans-serif; }
      #peanutGate p { margin: 0 auto 28px; max-width: 1100px; color: #c7c7c7; font: 400 clamp(17px, 2.5vw, 27px)/1.45 Arial, sans-serif; }
      #peanutGate button { display: inline-block; border: 0; border-radius: 23px; padding: 20px 40px; min-height: 70px; background: #232325; color: #f3f3f3; font: 700 clamp(19px, 2.6vw, 30px)/1.2 Arial, sans-serif; cursor: pointer; }
      #peanutGate.is-closing { opacity: 0 !important; pointer-events: none !important; }
      #peanutGate.is-dismissed { display: none !important; }
    </style>
    <link rel="stylesheet" href="css/peanut-gate.css?v=2">
    <script defer src="js/peanut-gate.js?v=2"></script>

</head>


<body class="peanut-lock">

    <!-- Peanut-free entrance (shown before the existing garden) -->
    <div id="peanutGate" class="peanut-gate" role="dialog" aria-modal="true"
         aria-labelledby="peanutGateTitle" aria-describedby="peanutGateDescription">
        <div class="peanut-gate-card">
            <svg class="peanut-gate-icon" width="44" height="44" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
            <h1 id="peanutGateTitle">Certified Peanut-Free Website</h1>
            <p id="peanutGateDescription">For your safety, absolutely no peanuts were used in the making of this website.</p>
            <button id="enterPeanutFree" class="peanut-gate-btn" type="button">Okay, let me in</button>
        </div>
    </div>


    <main>

    <!-- Interactive ASCII lily garden -->
    <section class="ascii-intro" aria-label="Grow the ASCII lilies">
        <canvas id="asciiLiliesCanvas" aria-label="Animated lilies drawn entirely from colored ASCII characters. Drag upward to grow them."></canvas>
        <div class="ascii-intro-controls">
            <button id="waterLilies" type="button">♡ Water the lilies</button>
            <button id="colorLilies" type="button">Colors: Pink</button>
            <button id="replayLilies" type="button">Start again</button>
            <button id="enterGarden" class="ascii-enter" type="button">Enter the garden ↓</button>
        </div>
    </section>


        <!-- ========================================
             PAGE 1
             CAMERON + DESMOS FLOWERS
        ========================================= -->

        <section class="hero" id="gardenStart">

            <div class="desmos-wrapper">

                <!-- DESMOS FLOWER GRAPH -->
                <div id="flowerCalculator"></div>


                <!-- CAMERON -->
                <h1 class="cameron-title">
                    Cameron.
                </h1>


                <!--
                    LOCK LAYER

                    When this layer is active,
                    scrolling moves the WEBSITE
                    instead of moving Desmos.
                -->
                <div
                    class="desmos-lock"
                    id="desmosLock"
                >

                    <button
                        class="explore-button"
                        id="exploreButton"
                    >
                        Explore
                    </button>

                </div>


                <!--
                    DONE BUTTON

                    Only appears while Desmos
                    is interactive.
                -->
                <button
                    class="done-button"
                    id="doneButton"
                >
                    Done
                </button>

            </div>

        </section>



        <!-- ========================================
             PAGE 2
             DESMOS HEART
        ========================================= -->

        <section class="heart-section">

            <div id="heartCalculator"></div>

        </section>

        <section class="whale-section" id="whaleHome" aria-label="The whale"><div class="whale-stars"></div><div class="whale-words"><h2>A little ocean of wonder.</h2><p>Some things are worth swimming across the world for.</p></div></section>
    </main>



    <!-- ========================================
         DESMOS API

         PASTE YOUR API KEY WHERE IT SAYS:

         MYAPIHERE
    ========================================= -->

    <script
        src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=b836d5b9911b48079c3f012e7dff2ae0">
    </script>



    <!-- ========================================
         OUR JAVASCRIPT
    ========================================= -->

    <!-- ASCII lilies intro -->
    <script src="js/ascii-lilies.js"></script>

    <!-- Flowers -->
    <script src="js/flowers.js"></script>

    <!-- Heart -->
    <script src="js/heart.js"></script>

    <!-- Explore / Done interaction -->
    <script src="js/main.js"></script>
    <script src="js/whale.js"></script>


</body>

</html>
