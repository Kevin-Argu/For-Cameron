<!DOCTYPE html>
<html lang="en" class="peanut-locked">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#040609">
    <meta name="desmos-api-key" content="b836d5b9911b48079c3f012e7dff2ae0">
    <title>Cameron</title>
    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="css/peanut-gate.css?v=4">
    <link rel="stylesheet" href="css/flower-math.css?v=4">
    <!-- Local controls initialize without waiting for the external graph library. -->
    <script defer src="js/main.js?v=4"></script>
    <script defer src="js/peanut-gate.js?v=4"></script>
    <script defer src="js/ascii-lilies.js?v=4"></script>
    <script defer src="js/whale.js?v=4"></script>
    <script defer src="js/flowers.js?v=4"></script>
    <script defer src="js/heart.js?v=4"></script>
    <script defer src="js/graph-loader.js?v=4"></script>
</head>
<body class="peanut-lock">
    <div id="peanutGate" class="peanut-gate" role="dialog" aria-modal="true"
         aria-labelledby="peanutGateTitle" aria-describedby="peanutGateDescription">
        <div class="peanut-gate-card">
            <svg class="peanut-gate-icon" width="120" height="120" viewBox="0 0 100 100" fill="none"
                 stroke="currentColor" stroke-width="3.5" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="50" cy="50" r="43"></circle>
                <g transform="rotate(45 50 50)" stroke-width="3">
                    <path d="M50 21 C37 21 33 30 35 40 C36 45 40 48 40 50
                             C40 52 36 56 36 62 C36 72 41 79 50 79
                             C59 79 64 72 64 62 C64 56 60 52 60 50
                             C60 48 64 45 65 40 C67 30 63 21 50 21 Z"></path>
                    <path d="m45 32 1 3 M54 31 l-1 3 M44 40 l1 3 M55 39 l-1 3
                             M46 58 l1 3 M54 58 l-1 3 M44 66 l1 3 M54 66 l-1 3"
                          stroke-width="2.2"></path>
                </g>
                <path d="M20 20 80 80" stroke-width="4.5"></path>
            </svg>
            <h1 id="peanutGateTitle">Certified Peanut-Free Website</h1>
            <p id="peanutGateDescription">For your safety, absolutely no peanuts were used in the making of this website.</p>
            <button id="enterPeanutFree" class="peanut-gate-btn" type="button">Okay, let me in</button>
            <noscript><p>Please enable JavaScript to enter the interactive garden.</p></noscript>
        </div>
    </div>

    <main inert aria-hidden="true">
        <section class="ascii-intro" id="lilyFinale" aria-label="Grow the ASCII lilies">
            <canvas id="asciiLiliesCanvas" role="img" aria-label="Animated lilies drawn from colored ASCII characters. Drag upward or use Water the lilies to grow them."></canvas>
            <div class="ascii-intro-controls">
                <div class="ascii-actions">
                    <button id="waterLilies" type="button">♡ Water the lilies</button>
                    <button id="colorLilies" type="button">Colors: Pink</button>
                    <button id="replayLilies" type="button">Start again</button>
                </div>
                <div class="ascii-enter-row">
                    <button id="enterGarden" class="ascii-enter" type="button">Enter the garden ↓</button>
                </div>
            </div>
        </section>

        <section class="hero" id="gardenStart" aria-label="Cameron's mathematical garden" tabindex="-1">
            <div class="desmos-wrapper">
                <div id="flowerCalculator" inert></div>
                <h1 class="cameron-title">Cameron.</h1>
                <div class="graph-status" id="flowerStatus">
                    <p role="status">Opening the garden…</p>
                    <button type="button" data-retry="flowers" hidden>Try again</button>
                </div>
                <div class="desmos-lock" id="desmosLock">
                    <button class="explore-button" id="exploreButton" type="button"
                            aria-controls="flowerCalculator" aria-expanded="false" disabled>Explore</button>
                </div>
                <button class="done-button" id="doneButton" type="button" hidden>Done</button>
            </div>
        </section>

        <section class="whale-section" id="whaleHome" aria-label="The whale">
            <div class="whale-stars" aria-hidden="true"></div>
            <div class="whale-words">
                <h2>A little ocean of wonder.</h2>
                <p>Some things are worth swimming across the world for.</p>
            </div>
        </section>

        <section class="heart-section" id="heartFinale" aria-label="The animated mathematical heart">
            <div class="heart-controls" aria-label="Heart controls">
                <button id="toggleHeartMath" type="button" aria-expanded="false"
                        aria-controls="heartCalculator" disabled>Show math</button>
                <button id="toggleHeartAnimation" type="button" disabled>Pause</button>
            </div>
            <div class="heart-stage">
                <div id="heartCalculator" inert></div>
                <div class="heart-lock" id="heartLock" aria-hidden="true"></div>
                <div class="graph-status" id="heartStatus">
                    <p role="status">Opening the heart…</p>
                    <button type="button" data-retry="heart" hidden>Try again</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
